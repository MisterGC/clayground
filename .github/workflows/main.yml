name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Manual on-demand runs (e.g. to validate a PR into a release branch, which
  # otherwise gets no CI) — kept opt-in to avoid burning runners on every PR.
  workflow_dispatch:

# Builds are ccache/sccache-accelerated (see "Setup compiler cache" below);
# warm runs reuse cached objects so only changed sources recompile. The WASM
# job additionally hashes emcc by content (emsdk lives at a per-run temp path).

# Prevent multiple runs of the same workflow on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


env:
  # Pin to 6.10.1 - wildcard causes issues when new versions are released (checksum propagation delays)
  QT_VERSION: '6.10.1'
  QT_VERSION_WASM: '6.10.1'
  QT_MODULES: 'qtmultimedia qtquick3d qtquick3dphysics qtquicktimeline qtshadertools qt5compat qtimageformats'
  CMAKE_BUILD_TYPE: Release
  AQT_VERSION: '>=3.2.0'
  EMSDK_VERSION: '4.0.7'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            qt-host: linux
            qt-target: desktop
            qt-arch: linux_gcc_64
          - os: windows-2022
            qt-host: windows
            qt-target: desktop
            qt-arch: win64_msvc2022_64
          - os: ubuntu-latest
            qt-host: all_os
            qt-target: wasm
            qt-arch: wasm_multithread

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Setup Emscripten
      if: matrix.qt-target == 'wasm'
      uses: mymindstorm/setup-emsdk@v16
      with:
        version: ${{ env.EMSDK_VERSION }}

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.qt-target == 'wasm' && env.QT_VERSION_WASM || env.QT_VERSION }}
        host: ${{ matrix.qt-host }}
        target: ${{ matrix.qt-target }}
        arch: ${{ matrix.qt-arch }}
        modules: ${{ env.QT_MODULES }}
        aqtversion: ${{ env.AQT_VERSION }}
        cache: true

    - name: Install Linux Dependencies
      if: runner.os == 'Linux' && matrix.qt-target == 'desktop'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libxkbcommon-dev libvulkan-dev

    - name: Install Linux Dependencies (WASM)
      if: matrix.qt-target == 'wasm'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build brotli

    - name: Install Windows Dependencies
      if: runner.os == 'Windows' && matrix.qt-target == 'desktop'
      run: choco install ninja -y
      shell: cmd

    - name: Setup MSVC
      if: runner.os == 'Windows' && matrix.qt-target == 'desktop'
      uses: ilammy/msvc-dev-cmd@v1

    # ccache on Linux/WASM, sccache on Windows (better MSVC support).
    # Wired into the build via CMAKE_<LANG>_COMPILER_LAUNCHER below.
    - name: Setup compiler cache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
        key: ${{ matrix.os }}-${{ matrix.qt-target }}
        max-size: 1G

    - name: Configure CMake (Desktop)
      if: matrix.qt-target == 'desktop'
      run: |
        cmake -B build -GNinja -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} -DQT_QMAKE_EXECUTABLE=qmake ${{ runner.os == 'Windows' && '-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl' || '' }} -DCMAKE_C_COMPILER_LAUNCHER=${{ runner.os == 'Windows' && 'sccache' || 'ccache' }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ runner.os == 'Windows' && 'sccache' || 'ccache' }} .

    - name: Configure CMake (WASM)
      if: matrix.qt-target == 'wasm'
      run: |
        "$QT_ROOT_DIR/bin/qt-cmake" -B build -GNinja -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache .

    - name: Build (Desktop)
      if: matrix.qt-target == 'desktop'
      run: cmake --build build
      env:
        CL: /MP

    - name: Build (WASM)
      if: matrix.qt-target == 'wasm'
      # emsdk installs to a per-run temp path, so ccache's default mtime compiler
      # check treats emcc as "new" every run and misses. Hash the compiler content
      # instead, and normalize paths, so warm runs actually hit.
      env:
        CCACHE_COMPILERCHECK: content
        CCACHE_BASEDIR: ${{ github.workspace }}
        CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,system_headers,pch_defines
      run: cmake --build build --target clayground_starter

    - name: Runtime Size Report (WASM)
      if: matrix.qt-target == 'wasm'
      run: |
        WASM=build/bin/clayground.wasm
        RAW=$(stat -c%s "$WASM")
        GZ=$(gzip -9 -c "$WASM" | wc -c)
        # -q9 instead of -q11: nearly identical ratio for a size estimate, but
        # seconds instead of ~90s on a ~30 MB wasm. The gate below is on raw size.
        BR=$(brotli -q 9 -c "$WASM" | wc -c)
        mb() { echo "$1" | awk '{printf "%.1f", $1/1048576}'; }
        {
          echo "### Clayground Web Runtime size"
          echo "| raw | gzip -9 | brotli -q9 |"
          echo "|---|---|---|"
          echo "| $(mb "$RAW") MB | $(mb "$GZ") MB | $(mb "$BR") MB |"
        } >> "$GITHUB_STEP_SUMMARY"
        # Soft budget gate (D9): warn when the raw wasm outgrows 40 MB
        if [ "$RAW" -gt 41943040 ]; then
          echo "::warning::clayground.wasm exceeds the 40 MB raw size budget ($(mb "$RAW") MB)"
        fi

    - name: Runtime Smoke Test (WASM)
      if: matrix.qt-target == 'wasm'
      run: |
        pip install playwright
        python3 tools/webdojo/tests/wasm_smoke_test.py build/clayground-starter \
          --screenshot starter-smoke.png

    # Clayground.Sound's first audio-device query used to deadlock the page's
    # main thread (#216) - a failure no desktop test can see.
    - name: Sound Regression (WASM)
      if: matrix.qt-target == 'wasm'
      run: |
        python3 tools/webdojo/tests/wasm_smoke_test.py build/clayground-starter \
          --overlay tools/webdojo/tests/pages/sound \
          --expect "clay-sound: audio device query returned" \
          --timeout 90

    - name: Test
      if: matrix.qt-target == 'desktop'
      working-directory: build
      run: ctest --output-on-failure

    - name: Upload Starter Bundle
      if: always() && matrix.qt-target == 'wasm'
      uses: actions/upload-artifact@v7
      with:
        name: clayground-starter
        path: |
          build/clayground-starter.zip
          starter-smoke.png
        if-no-files-found: ignore
        retention-days: 7
