<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="100mm"
   height="80mm"
   viewBox="0 0 100 80"
   version="1.1"
   id="scene-polygons">
  <g id="layer1">
    <rect
       id="marker"
       x="10"
       y="10"
       width="20"
       height="10"
       fill="#ffd93d">
      <desc id="desc-marker">{"component":"Marker"}</desc>
    </rect>
    <polygon
       id="plaza"
       points="10,20 40,20 40,50 25,50 25,70 10,70"
       fill="#00d9ff">
      <desc id="desc-plaza">{"component":"Area"}</desc>
    </polygon>
    <polygon
       id="tower"
       points="60,50 90,50 90,70 75,70"
       fill="#ffd93d">
      <desc id="desc-tower">{"component":"Area","properties":{"extrude":12}}</desc>
    </polygon>
    <polygon
       id="pond"
       points="60,10 90,10 90,40"
       fill="#ff3366" />
  </g>
</svg>
